on:
push:
branches:
- main
- master
workflow_dispatch:
​permissions:
contents: write
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout repository
uses: actions/checkout@v4
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Setup Gradle
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.5'
​- name: Build .cs3 plugins and plugins.json
run: gradle make makePluginsJson
​- name: Collect build artifacts
run: |
mkdir -p dist
find . -name "*.cs3" -exec cp {} dist/ ;
cp build/plugins.json dist/
​- name: Deploy to builds branch
uses: JamesIves/github-pages-deploy-action@v4
with:
branch: builds
folder: dist
clean: true
